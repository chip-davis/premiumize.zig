name: Release

# Push a tag like v0.1.0 to publish. The tag must match .version in build.zig.zon.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.1

      - name: Check tag matches build.zig.zon
        run: |
          version=$(grep -oP '\.version = "\K[^"]+' build.zig.zon)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME doesn't match build.zig.zon version $version"
            exit 1
          fi

      - name: Test
        run: zig build test --summary all

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## Install

          \`\`\`sh
          zig fetch --save git+https://github.com/${GITHUB_REPOSITORY}#${GITHUB_REF_NAME}
          \`\`\`
          EOF
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes
